<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="970" viewBox="0 0 1000 970"><rect width="1000" height="970" fill="#111827"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#94a3b8"/></marker></defs><g font-family="Arial, sans-serif"><text x="40" y="48" font-size="27" fill="white">Primera Merged DWG</text><text x="40" y="78" font-size="16" fill="#cbd5e1">Kolejność przetwarzania i próbki przestrzenne Skin</text><rect x="40" y="110" width="460" height="84" rx="12" fill="#243244" stroke="#64748b"/><text x="62" y="141" font-size="23" fill="white">DWG / Intermediate</text><text x="62" y="168" font-size="16" fill="#cbd5e1">Po RCM lub wejściowym CST</text><path d="M270 194V218" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="223" width="460" height="84" rx="12" fill="#1e3a5f" stroke="#64748b"/><text x="62" y="254" font-size="23" fill="white">Primary</text><text x="62" y="281" font-size="16" fill="#cbd5e1">Ekspozycja, balans, ton, saturacja</text><path d="M270 307V331" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="336" width="460" height="84" rx="12" fill="#1e3a5f" stroke="#64748b"/><text x="62" y="367" font-size="23" fill="white">Hue</text><text x="62" y="394" font-size="16" fill="#cbd5e1">Hue i density, Cinecolor, squeeze</text><path d="M270 420V444" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="449" width="460" height="84" rx="12" fill="#1e3a5f" stroke="#64748b"/><text x="62" y="480" font-size="23" fill="white">Split</text><text x="62" y="507" font-size="16" fill="#cbd5e1">Subtraktywne tonowanie cieni i świateł</text><path d="M270 533V557" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="562" width="460" height="84" rx="12" fill="#1e3a5f" stroke="#64748b"/><text x="62" y="593" font-size="23" fill="white">Skin</text><text x="62" y="620" font-size="16" fill="#cbd5e1">Maska, Evenness, HSV, Separation</text><path d="M270 646V670" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="675" width="460" height="84" rx="12" fill="#243244" stroke="#64748b"/><text x="62" y="706" font-size="23" fill="white">SpektraFilm</text><text x="62" y="733" font-size="16" fill="#cbd5e1">Wejście zgodne z DWG / Intermediate</text><path d="M270 759V783" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="788" width="460" height="84" rx="12" fill="#243244" stroke="#64748b"/><text x="62" y="819" font-size="23" fill="white">Wyjście do monitora</text><text x="62" y="846" font-size="16" fill="#cbd5e1">Jedna transformacja: plugin lub RCM/CST</text><path d="M505 596H570V265H506" stroke="#38bdf8" fill="none" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="595" y="340" font-size="20" fill="#7dd3fc">Soften / Separation</text><text x="595" y="375" font-size="16" fill="#cbd5e1">Każdy sąsiad maski przechodzi</text><text x="595" y="400" font-size="16" fill="#cbd5e1">przez Primary → Hue → Split.</text><text x="595" y="440" font-size="16" fill="#cbd5e1">Brak bufora pośredniego oznacza</text><text x="595" y="465" font-size="16" fill="#cbd5e1">ponowne obliczenia i większy koszt.</text><text x="40" y="946" font-size="15" fill="#94a3b8">Enable pomija daną sekcję. Bypass All zwraca wejściowe RGB. Sekcje UI są zawsze widoczne.</text></g></svg>